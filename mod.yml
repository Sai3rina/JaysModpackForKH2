title: Jay's Modpack for KH2
originalAuthor: Jay
description: Replaces Sora, and most of his model variants with an anthro Wolf Link. Includes model swaps for Auron based on my FF10 mod, a kitsune Xemnas, and a Roaring Knight/Clairen from ROA inspired Lingering Will too!
